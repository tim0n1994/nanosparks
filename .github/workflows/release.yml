name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify and publish internal preview
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Production build
        run: npm run build
      - name: Design system verification
        run: npm run verify:design
      - name: Create source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="nanosparks-${RELEASE_TAG}/" "${RELEASE_TAG}" > "nanosparks-${RELEASE_TAG}.tar.gz"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" "nanosparks-${RELEASE_TAG}.tar.gz" \
            --title "NanoSparks ${RELEASE_TAG}" \
            --generate-notes \
            --prerelease
