
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nanosparks
      POSTGRES_PASSWORD: nanosparks
      POSTGRES_DB: nanosparks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "15158:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=vector"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16688:6379"
    volumes:
      - redis_data:/data

  minio:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=1024 -filer -s3 -s3.port=9000 -s3.port.https=0
    ports:
      - "127.0.0.1:19000:9000"
    volumes:
      - minio_data:/data

  # bge-m3 embedding server (llama.cpp) — same model/pooling as the Mac
  # deployment; 159k existing pgvector rows are bge-m3/1024-d, so keep this
  # model on the same host. -t 2: physical cores only (HT halves throughput).
  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >-
      -m /models/bge-m3-q8_0.gguf --embedding --pooling mean
      --ctx-size 8192 --parallel 2 -t 2 --host 0.0.0.0 --port 8080
    cpu_shares: 512
    ports:
      - "127.0.0.1:17580:8080"
    volumes:
      - /home/jc/models/bge-m3:/models:ro

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nanosparks:nanosparks@postgres:5432/nanosparks
      REDIS_URL: redis://redis:6379
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      WHISPER_MODEL_SIZE: base
      # A1/A2/A4 providers + guardrails (PRD §A2 免 GPU / §A4 护栏)
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_ASR_MODEL: ${BAILIAN_ASR_MODEL:-paraformer-v2}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      RESOLVER_COOKIES: ${RESOLVER_COOKIES:-}
      GUARD_MAX_CONCURRENT: ${GUARD_MAX_CONCURRENT:-1}
      GUARD_MAX_DAILY: ${GUARD_MAX_DAILY:-5}
      GUARD_MAX_DURATION_SEC: ${GUARD_MAX_DURATION_SEC:-14400}
      GUARD_COST_BREAKER_CNY: ${GUARD_COST_BREAKER_CNY:-3}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      NODE_ENV: production
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nanosparks
      S3_ACCESS_KEY: nanosparks
      S3_SECRET_KEY: nanosparks123
      S3_REGION: us-east-1
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - whisper_models:/root/.cache/whisper
      - yt_audio:/tmp/nanosparks-audio

  worker:
    build: .
    restart: unless-stopped
    command: tsx src/lib/queue/worker.ts
    environment:
      DATABASE_URL: postgresql://nanosparks:nanosparks@postgres:5432/nanosparks
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      WHISPER_MODEL_SIZE: base
      # Same A1/A2/A4 keys the worker needs (ASR + LLM + resolver cookies + guardrails).
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_ASR_MODEL: ${BAILIAN_ASR_MODEL:-paraformer-v2}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      RESOLVER_COOKIES: ${RESOLVER_COOKIES:-}
      GUARD_MAX_CONCURRENT: ${GUARD_MAX_CONCURRENT:-1}
      GUARD_MAX_DAILY: ${GUARD_MAX_DAILY:-5}
      GUARD_MAX_DURATION_SEC: ${GUARD_MAX_DURATION_SEC:-14400}
      GUARD_COST_BREAKER_CNY: ${GUARD_COST_BREAKER_CNY:-3}
      NODE_ENV: production
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: nanosparks
      S3_ACCESS_KEY: nanosparks
      S3_SECRET_KEY: nanosparks123
      S3_REGION: us-east-1
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-}
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - whisper_models:/root/.cache/whisper
      - yt_audio:/tmp/nanosparks-audio

volumes:
  postgres_data:
  redis_data:
  minio_data:
  whisper_models:
  yt_audio:
